# O site estático (out/ do Next, com trailingSlash) servido pelo nginx.
# Faz o mesmo que o vercel.json: idioma pela raiz, /es aposentado, cabeçalhos e cache.

# Primeiro idioma do navegador: en vai para /en/, o resto para /pt/.
map $http_accept_language $idioma {
    default  /pt/;
    ~*^en    /en/;
}

# Limite por IP: 20 requisições por segundo, com folga para rajadas.
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecionamento relativo: atrás do túnel a porta interna (8080) não existe para o visitante.
    absolute_redirect off;

    # Atrás da Cloudflare, o IP real do visitante vem neste cabeçalho.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    limit_req zone=por_ip burst=40 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    error_page 404 /404.html;

    location = / {
        add_header Vary "Accept-Language" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 307 $idioma;
    }

    location ~ ^/es(/.*)?$ {
        return 308 /pt$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Arquivos com hash no nome não mudam: cache de um ano.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
